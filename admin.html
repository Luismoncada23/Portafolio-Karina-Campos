<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta name="robots" content="noindex, nofollow">
<title>Panel de administración</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Misma paleta y tipografías que el portafolio -->
<script src="script.js"></script>
<link href="style.css" rel="stylesheet">
<style>
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  details[open] > summary .chev { transform: rotate(180deg); }
  .chev { transition: transform .2s ease; }
  :focus-visible { outline: 2px solid #4cd7f6; outline-offset: 2px; }
  input[type=range] { accent-color: #4cd7f6; }
  .crop-stage { touch-action: none; cursor: grab; }
  .crop-stage:active { cursor: grabbing; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .18s ease-out; }
  @media (prefers-reduced-motion: reduce) { .pop, .chev { animation: none; transition: none; } }
</style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen circuit-bg">

<div class="flex min-h-screen">
  <!-- Menú lateral -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 -translate-x-full lg:translate-x-0 lg:sticky lg:top-0 lg:h-screen transition-transform duration-200 bg-surface-container-lowest border-r border-outline-variant/30 flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-outline-variant/30 flex items-center gap-3">
      <span class="p-2 rounded-lg bg-surface-container-high border border-primary/30 text-primary flex"><span class="material-symbols-outlined text-[22px]">tune</span></span>
      <div class="min-w-0">
        <p class="text-title-lg font-title-lg text-on-surface leading-tight">Mi portafolio</p>
        <p id="siteName" class="text-label-sm font-label-sm text-on-surface-variant truncate">Panel de administración</p>
      </div>
    </div>
    <nav id="menu" class="flex-1 overflow-y-auto p-3 space-y-1" aria-label="Secciones del panel"></nav>
    <div class="p-4 border-t border-outline-variant/30 space-y-2">
      <button id="btnLogout" type="button" class="hidden w-full items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-on-surface-variant hover:text-error hover:bg-error-container/20 text-label-md font-label-md transition-colors">
        <span class="material-symbols-outlined text-[18px]">logout</span>Cerrar sesión
      </button>
      <a class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg border border-outline-variant/50 hover:border-primary text-on-surface-variant hover:text-primary text-label-md font-label-md transition-colors" href="index.html" target="_blank" rel="noopener">
        <span class="material-symbols-outlined text-[18px]">open_in_new</span>Ver mi portafolio publicado
      </a>
    </div>
  </aside>
  <div id="scrim" class="fixed inset-0 z-30 bg-black/60 hidden lg:hidden"></div>

  <!-- Contenido -->
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="sticky top-0 z-20 bg-surface/85 backdrop-blur-md border-b border-outline-variant/30">
      <div class="flex items-center gap-3 px-4 lg:px-10 py-3">
        <button id="openMenu" type="button" class="lg:hidden p-2 rounded-lg hover:bg-surface-container-high text-on-surface" aria-label="Abrir menú">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 id="viewTitle" class="text-title-lg font-title-lg text-on-surface truncate">Resumen</h1>
        <div class="flex-1"></div>
        <span id="saveState" class="hidden md:inline-flex items-center gap-1.5 text-label-sm font-label-sm text-on-surface-variant" role="status" aria-live="polite"></span>
        <button id="btnPreview" type="button" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg border border-outline-variant/50 hover:border-primary text-on-surface hover:text-primary text-label-md font-label-md transition-colors">
          <span class="material-symbols-outlined text-[18px]">visibility</span><span class="hidden sm:inline">Vista previa</span>
        </button>
        <button id="btnPublish" type="button" class="relative inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-gradient-to-r from-primary-container to-primary text-on-primary text-label-md font-label-md font-bold shadow-lg shadow-primary/20 hover:shadow-primary/40 active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[18px]">cloud_upload</span><span>Publicar</span>
          <span id="dirtyDot" class="hidden absolute -top-1 -right-1 w-3 h-3 rounded-full bg-tertiary ring-2 ring-background"></span>
        </button>
      </div>
    </header>
    <main id="view" class="w-full max-w-4xl mx-auto px-4 lg:px-10 py-8 pb-24"></main>
  </div>
</div>


<!-- Inicio de sesión (solo cuando la conexión con Supabase está activa) -->
<div id="login" class="hidden fixed inset-0 z-[70] bg-background circuit-bg overflow-y-auto">
  <div class="min-h-full flex items-center justify-center p-5">
    <form id="loginForm" class="glass-panel w-full max-w-sm rounded-2xl p-7 space-y-5" novalidate>
      <div class="flex items-center gap-3">
        <span class="p-2.5 rounded-lg bg-surface-container-high border border-primary/30 text-primary flex"><span class="material-symbols-outlined text-[24px]">lock</span></span>
        <div><h1 class="text-title-lg font-title-lg text-on-surface">Panel de administración</h1><p class="text-body-sm text-on-surface-variant">Entra para editar tu portafolio.</p></div>
      </div>
      <div class="space-y-1.5"><label for="loginEmail" class="block text-label-md font-label-md text-on-surface">Correo</label>
        <input id="loginEmail" type="email" autocomplete="username" required class="w-full rounded-lg bg-surface-container-lowest border border-outline-variant/60 px-3.5 py-2.5 text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/30 focus:outline-none"></div>
      <div class="space-y-1.5"><label for="loginPass" class="block text-label-md font-label-md text-on-surface">Contraseña</label>
        <input id="loginPass" type="password" autocomplete="current-password" required class="w-full rounded-lg bg-surface-container-lowest border border-outline-variant/60 px-3.5 py-2.5 text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/30 focus:outline-none"></div>
      <p id="loginError" class="hidden text-body-sm text-error" role="alert"></p>
      <button id="loginBtn" type="submit" class="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-lg bg-gradient-to-r from-primary-container to-primary text-on-primary text-label-md font-label-md font-bold shadow-lg shadow-primary/20 disabled:opacity-60">Entrar</button>
      <a href="index.html" class="block text-center text-body-sm text-on-surface-variant hover:text-primary">Volver al portafolio</a>
    </form>
  </div>
</div>

<div id="toasts" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[90] flex flex-col items-center gap-2 w-[calc(100%-2rem)] max-w-md pointer-events-none" aria-live="polite"></div>
<div id="modal-root"></div>

<noscript><p class="p-8 text-center text-on-surface-variant">Este panel necesita JavaScript.</p></noscript>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="portfolio-remote.js"></script>
<script src="portfolio-core.js"></script>
<script src="admin.js"></script>
</body>
</html>
